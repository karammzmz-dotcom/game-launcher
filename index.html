<!DOCTYPE html>
<html lang="en" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Outfit:wght@300;400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--d:1;--e:cubic-bezier(.22,.9,.24,1)}
:root[data-motion=reduced]{--d:.35}
:root[data-motion=off]{--d:0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font),system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background-color calc(var(--d)*450ms) var(--e),color calc(var(--d)*450ms) var(--e);user-select:none}
#app[data-theme=xbox]{--bg:#0a120d;--fg:#fff;--mut:rgba(255,255,255,.66);--font:'Archivo';--tw:clamp(110px,21vmin,210px);--ar:4/5;--r:3px;--gap:1.2rem;--dockbg:rgba(255,255,255,.1);--focusbg:#fff;--focusfg:#0a120d;--ring:0 0 0 .22rem #fff,0 1.6rem 3rem rgba(0,0,0,.55);--panelbg:rgba(14,26,18,.84);--dr:3px;--tf:scale(1.07);--tr:scale(1);--ro:.8;--bgop:.5;--hw:700;--ok:#5dc21e;--bk:#e8483c;--ord:0;--ta:left;--ls:-.01em}
#app[data-theme=playstation]{--bg:#050b1f;--fg:#fff;--mut:rgba(214,228,255,.68);--font:'Outfit';--tw:clamp(100px,19vmin,190px);--ar:1;--r:1.15rem;--gap:1.7rem;--dockbg:rgba(255,255,255,.12);--focusbg:#fff;--focusfg:#050b1f;--ring:0 0 0 .16rem rgba(255,255,255,.95),0 0 3.2rem rgba(90,150,255,.65);--panelbg:rgba(8,16,48,.82);--dr:50%;--tf:scale(1.22);--tr:scale(.9);--ro:.5;--bgop:.4;--hw:300;--ok:#6c9bff;--bk:#ff6a7a;--ord:2;--ta:center;--ls:.02em}
#app[data-theme=switch]{--bg:#ececec;--fg:#2b2b2b;--mut:#737373;--font:'Nunito';--tw:clamp(110px,22vmin,220px);--ar:1;--r:.5rem;--gap:1.3rem;--dockbg:#fff;--focusbg:#fff;--focusfg:#2b2b2b;--ring:0 0 0 .3rem #00c3e3,0 .8rem 1.6rem rgba(0,0,0,.22);--panelbg:rgba(250,250,250,.9);--dr:50%;--tf:scale(1.05);--tr:scale(1);--ro:1;--bgop:0;--hw:800;--ok:#555;--bk:#555;--ord:2;--ta:left;--ls:0}
#bgs{position:absolute;inset:0;opacity:var(--bgop);transition:opacity calc(var(--d)*450ms) var(--e);filter:blur(40px) saturate(1.2);transform:scale(1.2)}
#bgs i{position:absolute;inset:0;opacity:0;transition:opacity calc(var(--d)*600ms) var(--e)}
#bgs i.on{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,rgba(0,0,0,.55));opacity:calc(1 - (var(--bgop) = 0))}
#app[data-theme=switch] .shade{display:none}
header,main,footer{position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:1.4rem var(--pad,8vw) 0}
.who{display:flex;align-items:center;gap:.8rem;font-weight:600}
.av{width:2.4rem;height:2.4rem;border-radius:50%;background:linear-gradient(135deg,#8be,#c6f)}
#clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mut)}
main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2.6rem}
.info{order:var(--ord);padding:0 var(--pad,8vw);text-align:var(--ta);min-height:7.5rem}
.info h1{font-size:clamp(1.8rem,4.6vmin + .5rem,3.4rem);font-weight:var(--hw);letter-spacing:var(--ls);line-height:1.1;transition:font-weight calc(var(--d)*300ms)}
.info .d{margin:.6rem 0 0;color:var(--fg);opacity:.9;font-size:1.05rem;max-width:36ch;display:inline-block}
.info .s{margin-top:.35rem;color:var(--mut);font-size:.9rem;font-weight:600}
.rowwrap{width:100%}
.row{display:flex;gap:var(--gap);width:max-content;position:relative;padding:1.4rem 0;transition:transform calc(var(--d)*520ms) var(--e);will-change:transform}
.tile{position:relative;width:var(--tw);aspect-ratio:var(--ar);flex:none;border-radius:var(--r);transform:var(--tr);opacity:var(--ro);transition:transform calc(var(--d)*380ms) var(--e),opacity calc(var(--d)*380ms) var(--e),box-shadow calc(var(--d)*380ms) var(--e),border-radius calc(var(--d)*450ms) var(--e),width calc(var(--d)*450ms) var(--e)}
.tile .art{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b))}
.tile .art::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.35),transparent 55%)}
.tile .art b{position:absolute;right:-.05em;bottom:-.2em;font-size:calc(var(--tw)*.8);line-height:1;font-weight:800;color:rgba(255,255,255,.22)}
.tile.f{transform:var(--tf);opacity:1;box-shadow:var(--ring);z-index:2}
#app[data-theme=switch] .tile.f{animation:pulse calc(var(--d)*1s) ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 .3rem #00c3e3,0 .8rem 1.6rem rgba(0,0,0,.22)}to{box-shadow:0 0 0 .3rem #9af2ff,0 .8rem 1.6rem rgba(0,0,0,.22)}}
footer{display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad,8vw) 1.4rem;gap:1rem}
.dock{display:flex;gap:.8rem}
.dk{display:flex;align-items:center;height:3rem;min-width:3rem;padding:0 .85rem;border-radius:var(--dr);background:var(--dockbg);color:var(--fg);transition:background-color calc(var(--d)*300ms) var(--e),color calc(var(--d)*300ms) var(--e),box-shadow calc(var(--d)*300ms) var(--e),transform calc(var(--d)*300ms) var(--e)}
#app[data-theme=switch] .dk{box-shadow:0 .15rem .5rem rgba(0,0,0,.15)}
.dk svg{width:1.3rem;height:1.3rem;flex:none}
.dk span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-weight:600;transition:max-width calc(var(--d)*400ms) var(--e),opacity calc(var(--d)*300ms) var(--e),margin calc(var(--d)*400ms) var(--e)}
.dk.f{background:var(--focusbg);color:var(--focusfg);transform:scale(1.06)}
#app[data-theme=xbox] .dk.f{box-shadow:0 0 0 .18rem #fff}
#app[data-theme=playstation] .dk.f{box-shadow:0 0 2rem rgba(120,170,255,.55)}
#app[data-theme=switch] .dk.f{box-shadow:0 0 0 .22rem #00c3e3}
.dk.f span{max-width:9rem;opacity:1;margin-left:.6rem;margin-right:.2rem}
.hints{display:flex;color:var(--mut);font-size:.88rem;font-weight:600}
.hint{display:inline-flex;align-items:center;gap:.5rem;margin-left:1.3rem}
.g,.k{display:inline-grid;place-items:center;height:1.7rem;font-size:.8rem;font-weight:700;border:.12rem solid currentColor}
.g{width:1.7rem;border-radius:50%}
.k{padding:0 .5rem;border-radius:.4rem}
.g.ok{color:var(--ok)}.g.bk{color:var(--bk)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity calc(var(--d)*350ms) var(--e)}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(26rem,92vw);padding:calc(2rem + env(safe-area-inset-top)) 1.4rem 2rem;background:var(--panelbg);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);transform:translateX(104%);transition:transform calc(var(--d)*480ms) var(--e);display:flex;flex-direction:column;gap:.4rem;color:var(--fg)}
#panel.on{transform:none}
#panel h2{font-size:1.5rem;font-weight:var(--hw);margin:0 0 1rem .6rem;letter-spacing:var(--ls)}
.pr{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.1rem;border-radius:calc(var(--r) + .2rem);font-weight:600;transition:background-color calc(var(--d)*250ms) var(--e),color calc(var(--d)*250ms) var(--e)}
.pr.f{background:var(--focusbg);color:var(--focusfg)}
.pr .v{opacity:.75;font-weight:400}
.pr.f .v{opacity:1}
#launch{position:fixed;inset:0;display:none;place-items:center;color:#fff;text-align:center;z-index:9}
#launch.on{display:grid}
#launch h2{font-size:2.2rem;font-weight:700;margin-top:1.2rem}
#launch p{opacity:.8;margin-top:.3rem}
.spin{width:2.6rem;height:2.6rem;border-radius:50%;border:.28rem solid rgba(255,255,255,.3);border-top-color:#fff;margin:auto;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
::view-transition-group(root){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,.9,.24,1)}
@media (max-width:600px){.hints{display:none}header,footer{padding-inline:1.4rem}.info{padding-inline:1.4rem}}
</style>
</head>
<body>
<div id="app" data-theme="xbox">
  <div id="bgs"></div><div class="shade"></div>
  <header><div class="who"><i class="av"></i><span>Player One</span></div><div id="clock"></div></header>
  <main>
    <section class="info"><h1 id="t"></h1><p class="d" id="d"></p><p class="s" id="s"></p></section>
    <div class="rowwrap"><div class="row" id="row"></div></div>
  </main>
  <footer>
    <nav class="dock" id="dock">
      <button class="dk" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></button>
      <button class="dk" aria-label="Change style"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18c1.4 0 2-1 1.6-2-.5-1.200.3-2.500 1.700-2.500H17a4 4 0 004-4c0-5-4-9.500-9-9.500z"/></svg><span>Style</span></button>
    </nav>
    <div class="hints" id="hints"></div>
  </footer>
  <div id="scrim"></div>
  <aside id="panel" aria-label="Settings"><h2>Settings</h2><div id="prs"></div></aside>
  <div id="launch"><div><div class="spin"></div><h2 id="lt"></h2><p>Starting up</p></div></div>
</div>
<script>
const G=[
['Starfall Drift','Space adventure',42,'Chart the quiet edges of a dying galaxy.','#5b2bff','#19b5ff'],
['Hollow Peak','Platformer',18,'Climb a mountain that remembers every fall.','#ff6a3d','#ffc857'],
['Neon Circuit','Racing',9,'Night races through a city built on light.','#ff2d95','#6a1bff'],
['Tidebound','Survival',63,'Build a life on the last islands above water.','#0aa6a0','#0b3d91'],
['Ember Kart','Party racer',27,'Four players, one very short fuse.','#ff8a00','#e52d27'],
['Mosswood','Cozy farming',110,'Grow a village from a single seed.','#4caf50','#c6e377'],
['Void Chess','Strategy',5,'Every piece moves a little differently.','#222a68','#7b8cde'],
['Pocket Kingdoms','Strategy RPG',36,'Rule small realms with big problems.','#b0287b','#ffb347']
].map(a=>({n:a[0],g:a[1],h:a[2],d:a[3],a:a[4],b:a[5],id:a[0].toLowerCase().replace(/\W+/g,'_')}));
try{if(window.Android&&Android.getApps){const l=JSON.parse(Android.getApps());if(l.length){G.length=0;l.forEach(a=>{const h=[...a.p].reduce((x,c)=>(x*31+c.charCodeAt(0))>>>0,7)%360;G.push({n:a.n,g:'App',h:null,d:a.p,a:'hsl('+h+' 70% 50%)',b:'hsl('+((h+50)%360)+' 70% 38%)',id:a.p})})}}}catch(e){}
const T=['xbox','playstation','switch'];
const OPTS=[
{k:'theme',l:'Console style',v:T,n:{xbox:'Xbox',playstation:'PlayStation',switch:'Nintendo Switch'}},
{k:'text',l:'Text size',v:['small','medium','large'],n:{small:'Small',medium:'Medium',large:'Large'}},
{k:'motion',l:'Animation',v:['full','reduced','off'],n:{full:'Full',reduced:'Reduced',off:'Off'}},
{k:'clock',l:'Clock',v:['12','24'],n:{12:'12-hour',24:'24-hour'}}];
const GL={xbox:{ok:'A',back:'B',menu:'≡'},playstation:{ok:'✕',back:'○',menu:'≡'},switch:{ok:'A',back:'B',menu:'+'}};
const KL={ok:'Enter',back:'Esc',menu:'S'};
const $=s=>document.querySelector(s),app=$('#app'),row=$('#row'),bgs=$('#bgs'),dock=[...document.querySelectorAll('.dk')],panel=$('#panel'),prs=$('#prs'),scrim=$('#scrim'),L=$('#launch');
let S={theme:'xbox',text:'medium',motion:matchMedia('(prefers-reduced-motion:reduce)').matches?'reduced':'full',clock:'12'};
try{Object.assign(S,JSON.parse(localStorage.getItem('launcher')||'{}'))}catch(e){}
let zone='row',i=0,dk=0,pi=0,input='key',busy=false;
const D=()=>({full:1,reduced:.35,off:0})[S.motion]||1;
const EASE='cubic-bezier(.22,.9,.24,1)';
const save=()=>{try{localStorage.setItem('launcher',JSON.stringify(S))}catch(e){}};

G.forEach((g,n)=>{
  const t=document.createElement('button');t.className='tile';t.tabIndex=-1;t.setAttribute('aria-label',g.n);
  t.style.setProperty('--a',g.a);t.style.setProperty('--b',g.b);
  t.innerHTML='<span class="art"><b>'+g.n[0]+'</b></span>';
  t.onclick=()=>{input='key';if(zone!=='row'||i!==n){zone='row';i=n;render()}else launch(n)};
  row.appendChild(t);
  const b=document.createElement('i');b.style.background='linear-gradient(135deg,'+g.a+','+g.b+')';bgs.appendChild(b);
});
const tiles=[...row.children],bgl=[...bgs.children];
dock.forEach((b,n)=>b.onclick=()=>{input='key';zone='dock';dk=n;render();act('ok')});
scrim.onclick=()=>closePanel();

function layout(){
  const t=tiles[i],W=innerWidth,pad=S.theme==='xbox'?W*.08:W*.1;
  app.style.setProperty('--pad',(S.theme==='playstation'?W*.08:pad)+'px');
  let x;
  if(S.theme==='playstation')x=W/2-(t.offsetLeft+t.offsetWidth/2);
  else if(S.theme==='xbox')x=pad-t.offsetLeft;
  else x=Math.min(pad,W-pad-(t.offsetLeft+t.offsetWidth));
  row.style.transform='translate3d('+x+'px,0,0)';
}
let lastI=-1;
function render(){
  tiles.forEach((t,n)=>t.classList.toggle('f',zone==='row'&&n===i||zone!=='row'&&n===i&&false));
  if(zone!=='row')tiles[i].classList.add('f');
  bgl.forEach((b,n)=>b.classList.toggle('on',n===i));
  dock.forEach((b,n)=>b.classList.toggle('f',zone==='dock'&&n===dk));
  if(i!==lastI){
    const g=G[i];$('#t').textContent=g.n;$('#d').textContent=g.d;$('#s').textContent=g.g+(g.h?', '+g.h+' h played':'');
    if(lastI>=0&&D()>0)$('.info').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:320*D(),easing:EASE});
    lastI=i;
  }
  layout();
  [...prs.children].forEach((r,n)=>r.classList.toggle('f',zone==='panel'&&n===pi));
}
function hints(){
  const m=input==='pad'?GL[S.theme]:KL,c=input==='pad'?'g':'k';
  $('#hints').innerHTML=[['ok','Play'],['back','Back'],['menu','Settings']].map(([a,l])=>'<span class="hint"><i class="'+c+' '+(c==='g'?(a==='menu'?'':a==='ok'?'ok':'bk'):'')+'">'+m[a]+'</i>'+l+'</span>').join('');
}
function clock(){
  const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:S.clock==='12'});
}
function renderPanel(){
  prs.innerHTML=OPTS.map(o=>'<div class="pr"><span>'+o.l+'</span><span class="v">‹ '+o.n[S[o.k]]+' ›</span></div>').join('')+'<div class="pr"><span>Done</span></div>';
  [...prs.children].forEach((r,n)=>r.onclick=()=>{input='key';pi=n;n===OPTS.length?closePanel():step(n,1);render()});
}
function apply(){
  app.dataset.theme=S.theme;
  document.documentElement.dataset.motion=S.motion;
  document.documentElement.style.fontSize=16*({small:.9,medium:1,large:1.18})[S.text]+'px';
  clock();hints();renderPanel();render();save();
}
function change(fn){
  if(document.startViewTransition&&S.motion!=='off')document.startViewTransition(fn);else fn();
}
function step(n,dir){
  const o=OPTS[n],v=o.v,idx=(v.indexOf(S[o.k])+dir+v.length)%v.length;
  const set=()=>{S[o.k]=v[idx];apply()};
  o.k==='theme'?change(set):set();
}
function cycleTheme(dir){change(()=>{S.theme=T[(T.indexOf(S.theme)+dir+3)%3];apply()})}
function openPanel(){zone='panel';pi=0;panel.classList.add('on');scrim.classList.add('on');render()}
function closePanel(){zone='row';panel.classList.remove('on');scrim.classList.remove('on');render()}

function launch(n){
  if(busy)return;busy=true;
  const g=G[n],t=tiles[n],r=t.getBoundingClientRect(),br=getComputedStyle(t).borderRadius;
  $('#lt').textContent=g.n;
  L.style.background='linear-gradient(135deg,'+g.a+','+g.b+')';L.classList.add('on');
  const from='inset('+r.top+'px '+(innerWidth-r.right)+'px '+(innerHeight-r.bottom)+'px '+r.left+'px round '+br+')';
  const a=L.animate([{clipPath:from},{clipPath:'inset(0px round 0px)'}],{duration:Math.max(1,440*D()),easing:EASE,fill:'forwards'});
  try{if(window.Android&&Android.launch)Android.launch(g.id)}catch(e){}
  setTimeout(()=>{a.playbackRate=-1;a.play();a.onfinish=()=>{L.classList.remove('on');a.cancel();busy=false}},1600);
}
function act(a){
  if(busy)return;
  if(a==='themePrev')return cycleTheme(-1);
  if(a==='themeNext')return cycleTheme(1);
  if(zone==='panel'){
    if(a==='up')pi=(pi+OPTS.length)%(OPTS.length+1);
    else if(a==='down')pi=(pi+1)%(OPTS.length+1);
    else if(a==='back'||a==='menu')return closePanel();
    else if(pi===OPTS.length){if(a==='ok')return closePanel()}
    else if(a==='left')return step(pi,-1);
    else if(a==='right'||a==='ok')return step(pi,1);
    if(a==='up'&&pi===0&&false)return;
    return render();
  }
  if(a==='menu')return openPanel();
  if(zone==='row'){
    if(a==='left')i=Math.max(0,i-1);
    else if(a==='right')i=Math.min(G.length-1,i+1);
    else if(a==='down'){zone='dock';dk=0}
    else if(a==='ok')return launch(i);
  }else{
    if(a==='left')dk=Math.max(0,dk-1);
    else if(a==='right')dk=Math.min(dock.length-1,dk+1);
    else if(a==='up'||a==='back')zone='row';
    else if(a==='ok')return dk===0?openPanel():cycleTheme(1);
  }
  render();
}
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',' ':'ok',Escape:'back',Backspace:'back',GoBack:'back',BrowserBack:'back',s:'menu',S:'menu',ContextMenu:'menu',Tab:'menu',q:'themePrev',e:'themeNext',1:'t1',2:'t2',3:'t3'};
addEventListener('keydown',e=>{
  const a=KM[e.key];if(!a)return;e.preventDefault();
  if(input!=='key'){input='key';hints()}
  if(a[0]==='t'&&a.length===2)return change(()=>{S.theme=T[+a[1]-1];apply()});
  act(a);
});
let pd=null,rep=0,prev={};
const MAP={0:'ok',1:'back',3:'menu',9:'menu',4:'themePrev',5:'themeNext'};
function poll(now){
  const gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);
  if(gp){
    const b=n=>gp.buttons[n]&&gp.buttons[n].pressed,x=gp.axes[0]||0,y=gp.axes[1]||0;
    const dir=b(14)||x<-.55?'left':b(15)||x>.55?'right':b(12)||y<-.55?'up':b(13)||y>.55?'down':null;
    if(dir&&(dir!==pd||now>rep)){setPad();act(dir);rep=now+(dir===pd?110:380)}
    pd=dir;
    for(const k in MAP){const p=b(+k);if(p&&!prev[k]){setPad();act(MAP[k])}prev[k]=p}
  }
  requestAnimationFrame(poll);
}
function setPad(){if(input!=='pad'){input='pad';hints()}}
addEventListener('gamepadconnected',setPad);
addEventListener('resize',layout);
addEventListener('wheel',e=>{if(zone==='row'&&Math.abs(e.deltaY+e.deltaX)>30)act((e.deltaY+e.deltaX)>0?'right':'left')},{passive:true});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(zone==='row'&&Math.abs(d)>60)act(d<0?'right':'left')},{passive:true});
setInterval(clock,15000);
window.__pad=setPad;apply();if(!window.Android)requestAnimationFrame(poll);
</script>
</body>
</html>
